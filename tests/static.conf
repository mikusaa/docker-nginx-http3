server {
    listen       80;
    server_name  localhost;

    location = /zstd-small {
        zstd on;
        zstd_min_length 0;
        default_type text/plain;
        return 200 'small zstd response';
    }

    location = /zstd-empty {
        zstd on;
        zstd_min_length 0;
        return 200 '';
    }

    location = /zstd-proxy {
        zstd on;
        zstd_min_length 0;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:80/stream;
        proxy_set_header Host njs;
    }

    location / {
        root   /static;

        gzip_static on;
        brotli_static on;

        expires 1d;
    }

    location ~ [A-Z] {
        add_header x-rewrite 1;
        rewrite ^(.*)$ $scheme://$host$uri_lowercase permanent;
    }
}
