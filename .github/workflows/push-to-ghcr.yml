name: Build and publish a Docker image to ghcr.io and Docker Hub
on:
  workflow_run:
    workflows: [Docker Image CI]
    types: [completed]
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  docker_publish:
    if: >-
      inputs.ref != '' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    concurrency:
      group: publish-nginx-images
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha }}

      - name: Check tested commit is still master
        id: current
        run: |
          current="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [ -z "$current" ]; then
            echo 'Unable to find master' >&2
            exit 1
          fi
          if [ "$current" = "$(git rev-parse HEAD)" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping superseded commit'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.current.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.current.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.current.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.current.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read NGINX version
        if: steps.current.outputs.publish == 'true'
        id: nginx
        run: |
          version="$(awk -F= '/^ARG NGINX_VERSION=/ { print $2; exit }' Dockerfile)"
          if [ -z "$version" ]; then
            echo "Unable to read NGINX_VERSION from Dockerfile" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        if: steps.current.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/nginx-http3
            docker.io/mikusa/nginx-http3
          tags: |
            type=raw,value=latest
            type=raw,value=master
            type=raw,value=${{ steps.nginx.outputs.version }}

      - name: Build and publish Docker images
        if: steps.current.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
